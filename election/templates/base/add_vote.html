<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        #party_votes {
            margin-top: 20px;
        }
        #party_votes label {
            margin-top: 10px;
        }

        button, .btn {
            background-color: #3498db;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            margin-right: 10px;
        }
        button:hover, .btn:hover {
            background-color: #2980b9;
        }
        .button-container {
            text-align: center;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h2>Election Results Entry</h2>
    <p><i>Please wait for the Select polling unit to fetch</i></p>


    <div class="button-container">
        <a href="{%url 'homepage'%}" class="btn">Home</a>
        <a href="{%url 'lga-result'%}" class="btn">Add Result</a>
    </div>

    <form method="post" id="electionForm">
        {% csrf_token %}
        
        <label for="lga">Select Local Government:</label>
        <select id="lga" name="lga" required>
            <option value="" disabled selected>-- Choose Local Government --</option>
            {% for lga in lgas %}
                <option value="{{ lga.lga_id }}">{{ lga.lga_name }}</option>
            {% endfor %}
        </select>

        <input type="hidden" id="lga_id" name="lga_id">

        <label for="polling_unit">Select Polling Unit:</label>
        <select id="polling_unit" name="polling_unit" required>
            <option value="" disabled selected>-- Choose Polling Unit --</option>
        </select>

        <label for="num_parties">Enter Number of Parties:</label>
        <input type="number" id="num_parties" min="1" required>

        <button type="button" onclick="generatePartyInputs()">Generate Fields</button>

        <h3>Enter Votes for Each Party</h3>
        <div id="party_votes"></div>

        <button type="submit" id="submitBtn">Save Results <div class="spinner"></div></button>
    </form>
    
    <script>
        document.getElementById("lga").addEventListener("change", function() {
            let lgaId = this.value;
            let pollingUnitSelect = document.getElementById("polling_unit");

            // Set hidden lga_id input value
            document.getElementById("lga_id").value = lgaId;

            // Fetch polling units dynamically
            fetch(`/get_polling_units/?lga_id=` + lgaId)
                .then(response => response.json())
                .then(data => {
                    pollingUnitSelect.innerHTML = '<option value="" disabled selected>-- Choose Polling Unit --</option>';
                    data.forEach(unit => {
                        pollingUnitSelect.innerHTML += `<option value="${unit.polling_unit_id}">${unit.polling_unit_name}</option>`;
                    });
                });
        });

        function generatePartyInputs() {
            let numParties = document.getElementById("num_parties").value;
            let partyVotesDiv = document.getElementById("party_votes");

            // Clear existing fields
            partyVotesDiv.innerHTML = "";

            for (let i = 1; i <= numParties; i++) {
                let partyInput = `
                    <label for="party_${i}">Party ${i} Votes:</label>
                    <input 
                        type="number" 
                        name="party_${i}" 
                        id="party_${i}"
                        placeholder="Enter votes for Party ${i}"
                        min="0"
                        required
                    >
                    <br>
                `;
                partyVotesDiv.innerHTML += partyInput;
            }
        }
    </script>
</body>
</html>
